<!DOCTYPE html>
<html>
<header>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hi</title>
    <link rel="stylesheet" href="index.css">
    <link rel="icon" href="./mochibots/sg_soundwave.png" type="image/x-icon">

    <!-- Embed -->
    <meta content="mochibot merger" property="og:title" />
    <meta content="play my game" property="og:description" />
    <meta content="https://rockytanker.github.io/mochimerge/" property="og:url" />
    <meta content="https://rockytanker.github.io/mochimerge/mochibots/sg_soundwave.png" property="og:image" />
    <meta content="#fc8403" data-react-helmet="true" name="theme-color" />
</header>
<body>
    <h1>merge my mochis</h1>
    <div id="draggable"></div>
    <div class="container">
        <div id="game">
            <div class="gameItem"></div>
            <div class="gameItem"></div>
            <div class="gameItem"></div>
            <div class="gameItem"></div>
            <div class="gameItem"></div>
            <div class="gameItem"></div>
            <div class="gameItem"></div>
            <div class="gameItem"></div>
            <div class="gameItem"></div>
            <div class="gameItem"></div>
            <div class="gameItem"></div>
            <div class="gameItem"></div>
            <div class="gameItem"></div>
            <div class="gameItem"></div>
            <div class="gameItem"></div>
            <div class="gameItem"></div>
        </div>
        <div id="other">
            <div id="deleteItem"></div>
            <button onclick=newMochis()>i need more mochis</button>
            <div style="height: 50px;"></div>
            <button style="align-self: flex-end;" onclick=playMusic(this)>play epic music</button>
            <button style="align-self: flex-end;" onclick=toggleSFX(this)>turn off sfx</button>
        </div>
    </div>
    <p style="margin: 0;">inventory (this saves even if you reload)</p>
    <div class="container">
        <div id="inventory">
            <div class="inventoryItem"><p>1</p></div>
            <div class="inventoryItem"><p>2</p></div>
            <div class="inventoryItem"><p>3</p></div>
            <div class="inventoryItem"><p>4</p></div>
            <div class="inventoryItem"><p>5</p></div>
            <div class="inventoryItem"><p>6</p></div>
            <div class="inventoryItem"><p>7</p></div>
            <div class="inventoryItem"><p>8</p></div>
            <div class="inventoryItem"><p>9</p></div>
            <div class="inventoryItem"><p>10</p></div>
        </div>
    </div>
    
    <br><br>
    <a href="https://x.com/kurotype" style="font-size: 2rem;">made by @kurotype on twitter dot com</a>
    <br><br>
    <img src="./img/tierlist.png" width="100%">
    <br><br>
    <img width="50%" src="./mochibots/sg_soundwave.png">
    <br><br>
    <p>look at how scary he is</p>
    <script src="index.js"></script>
</body>
</html>
